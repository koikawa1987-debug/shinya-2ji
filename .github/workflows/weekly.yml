name: 編成会議

on:
  schedule:
    # 毎週月曜 04:00 JST（= 日曜 19:00 UTC）。日次編成より1時間先に走らせる
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      date:
        description: '会議の日付（YYYY-MM-DD／空なら今日）'
        required: false
        type: string
      llm:
        description: 'Claude API を使う（ANTHROPIC_API_KEY が要る・課金される）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: station-write
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - if: ${{ inputs.llm }}
        run: npm ci

      - name: 編成会議を開く
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_LLM: ${{ inputs.llm && '1' || '0' }}
          TZ: Asia/Tokyo
        run: |
          node generator/weekly.js \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: コミット
        run: |
          git config user.name  'JOZZ-DTV 編成部'
          git config user.email 'actions@users.noreply.github.com'
          git add data docs/data
          if git diff --staged --quiet; then
            echo '差分なし'
            exit 0
          fi
          git commit -m "編成会議 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
