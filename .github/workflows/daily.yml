name: 日次編成

on:
  schedule:
    # 毎朝 05:00 JST（= 前日 20:00 UTC）
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '生成する放送日（YYYY-MM-DD／空なら今日）'
        required: false
        type: string
      force:
        description: '生成済みでも作り直す'
        required: false
        type: boolean
        default: false
      llm:
        description: 'Claude API を使う（ANTHROPIC_API_KEY が要る・課金される）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 編成会議とぶつかると station.json の書き込みが競合するため直列にする
concurrency:
  group: station-write
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 既定の生成器は API を使わないので依存は要らない。
      # --llm を選んだときだけ SDK を入れる。
      - if: ${{ inputs.llm }}
        run: npm ci

      - name: ラテ欄を生成
        env:
          # 既定は空でよい。llm を選んだときだけ Secrets から入る
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_LLM: ${{ inputs.llm && '1' || '0' }}
          TZ: Asia/Tokyo
        run: |
          node generator/daily.js \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: コミット
        run: |
          git config user.name  'JOZZ-DTV 編成部'
          git config user.email 'actions@users.noreply.github.com'
          git add data docs/data
          if git diff --staged --quiet; then
            echo '差分なし'
            exit 0
          fi
          git commit -m "編成 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
